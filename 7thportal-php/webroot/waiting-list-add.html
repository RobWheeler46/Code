<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add to Waiting List - 7thPortal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<style>
  .wa-wrap{max-width:40rem}
  .wa-field{margin:.6rem 0}
  .wa-field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.2rem}
  .wa-field input,.wa-field select{width:100%;padding:.5rem;border:1px solid var(--border,#ccc);border-radius:6px}
  .wa-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  @media (max-width:40rem){.wa-grid{grid-template-columns:1fr}}
  .wa-sec{margin-top:1.2rem;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted,#6b6b6b)}
</style>
</head>
<body>
  <header id="app-nav" class="app-nav"></header>
  <div class="app-layout">
  <aside id="app-sidebar" class="app-sidebar"></aside>
  <main class="app-main">
  <div class="container wa-wrap">
    <div id="content"><p class="muted">Loading&hellip;</p></div>
  </div>
  </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/pageheader.js"></script>
  <script src="js/waiting-list-add.js"></script>
</body>
</html>
