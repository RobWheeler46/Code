<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waiting List - 7thPortal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<style>
  .wl-table-wrap{overflow-x:auto}
  table.wl-table{width:100%;border-collapse:collapse}
  table.wl-table th,table.wl-table td{padding:.5rem .6rem;text-align:left;border-bottom:1px solid var(--border,#eee);vertical-align:top}
  table.wl-table th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#6b6b6b)}
  .wl-contact{font-size:.9rem;margin:.1rem 0}
  .wl-contact .nm{font-weight:600}
  .wl-meta{font-size:.85rem;color:var(--muted,#6b6b6b);margin:.4rem 0 1rem}
</style>
</head>
<body>
  <header id="app-nav" class="app-nav"></header>
  <div class="app-layout">
  <aside id="app-sidebar" class="app-sidebar"></aside>
  <main class="app-main">
  <div class="container">
    <div id="content"><p class="muted">Loading&hellip;</p></div>
  </div>
  </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/pageheader.js"></script>
  <script src="js/waiting-list.js"></script>
</body>
</html>
