<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waiting List Write Test - 7thPortal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<style>
  .wt-wrap{max-width:40rem}
  .wt-field{margin:.6rem 0}
  .wt-field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.2rem}
  .wt-field input{width:100%;padding:.5rem;border:1px solid var(--border,#ccc);border-radius:6px}
  pre#wt-out{overflow:auto;max-height:24rem;background:var(--surface-2,#f2eef7);padding:.8rem;border-radius:8px;font-size:.8rem;white-space:pre-wrap;margin-top:1rem}
  .wt-confirm{display:flex;gap:.5rem;align-items:flex-start;margin:.8rem 0}
</style>
</head>
<body>
  <header id="app-nav" class="app-nav"></header>
  <div class="app-layout">
  <aside id="app-sidebar" class="app-sidebar"></aside>
  <main class="app-main">
  <div class="container wt-wrap">
    <div id="content"><p class="muted">Loading&hellip;</p></div>
  </div>
  </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/pageheader.js"></script>
  <script src="js/waiting-list-test.js"></script>
</body>
</html>
